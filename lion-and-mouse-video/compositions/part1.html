  <script>
    (function () {
      const tl = gsap.timeline({ paused: true });
      
      // camera: centre (cx, cy) of the stage at scale s
      const cam = (sel, t, s, cx, cy, d, ease) => tl.to(sel, { scale: s, x: 960 - s * cx, y: 540 - s * cy, duration: d, ease: ease || "power2.inOut" }, t);
      // seeded shake: deterministic offsets, no randomness
      const shake = (sel, t, d, amp, hz) => {
        const n = Math.max(2, Math.round(d * hz));
        const kf = [];
        for (let i = 1; i <= n; i++) kf.push({ x: Math.sin(i * 2.7) * amp * (1 - i / (n + 1)), y: Math.cos(i * 1.9) * amp * 0.5 * (1 - i / (n + 1)), duration: d / n });
        kf.push({ x: 0, y: 0, duration: 0.05 });
        tl.to(sel, { keyframes: kf, ease: "none" }, t);
      };
      const show = (sel, t, d) => tl.to(sel, { opacity: 1, duration: d || 0.12 }, t);
      const hide = (sel, t, d) => tl.to(sel, { opacity: 0, duration: d || 0.12 }, t);

      // ---- starting pose: lion asleep, lying down; mouse off-screen left ----
      tl.set("#a-torso", { y: 60 }, 0);
      tl.set("#a-head", { rotation: 14, svgOrigin: "470 250" }, 0);
      tl.set("#a-mwrap", { x: -180 }, 0);
      tl.set("#a-cam", { scale: 1, x: 0, y: 0 }, 0);

      // ---- title (0 - 3.6) ----
      tl.fromTo("#a-title .w", { opacity: 0, filter: "blur(8px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.2, stagger: 0.12, ease: "power4.out" }, 0.3);
      tl.to("#a-title", { opacity: 0, filter: "blur(8px)", duration: 0.3, ease: "power3.in" }, 3.5);

      // ---- sleeping: breathing and drifting z's (acting, not decoration) ----
      tl.to("#a-torso", { y: 54, duration: 1.4, repeat: 6, yoyo: true, ease: "sine.inOut" }, 0);
      [["#a-z1", 0.4], ["#a-z2", 0.9], ["#a-z3", 1.4], ["#a-z1", 3.4], ["#a-z2", 3.9], ["#a-z3", 4.4], ["#a-z1", 6.4], ["#a-z2", 6.9]].forEach(([z, t]) => {
        tl.fromTo(z, { opacity: 0, y: 0 }, { opacity: 1, y: -30, duration: 0.8, ease: "sine.out" }, t);
        tl.to(z, { opacity: 0, y: -60, duration: 0.8, ease: "sine.in" }, t + 1.2);
      });

      // ---- l1 (4.4 - 10.8): the mouse runs through the forest and across the paw ----
      tl.to("#a-mwrap", { x: 1380, duration: 5.6, ease: "none" }, 4.4);
      tl.to("#a-mouse", { y: -6, duration: 0.14, repeat: 39, yoyo: true, ease: "sine.inOut" }, 4.4);
      tl.to("#a-mwrap", { x: 1500, y: -24, duration: 0.35, ease: "power2.out" }, 10.0);
      tl.to("#a-mwrap", { x: 1620, y: 0, duration: 0.35, ease: "power2.in" }, 10.35);
      tl.to("#a-mwrap", { x: 1660, duration: 0.3, ease: "expo.out" }, 10.7);
      tl.to("#a-paw", { y: 3, duration: 0.1, yoyo: true, repeat: 1 }, 10.2);
      // lion stirs: tail flick
      tl.to("#a-tail", { rotation: -12, svgOrigin: "140 260", duration: 0.25, yoyo: true, repeat: 1 }, 11.0);

      // ---- l2 (12.2 - 18.3): wakes with a start, roars, traps the mouse ----
      tl.to("#a-eyesClosed", { opacity: 0, duration: 0.05 }, 12.75);
      tl.to("#a-eyesOpen", { opacity: 1, duration: 0.05 }, 12.75);
      tl.to("#a-head", { rotation: -10, y: -30, svgOrigin: "470 250", duration: 0.25, ease: "back.out(2.2)" }, 12.7);
      tl.to("#a-torso", { y: 40, duration: 0.25, ease: "back.out(2)" }, 12.7);
      // mouse jumps in fright and turns to face the lion
      tl.to("#a-mouse", { y: -40, duration: 0.2, ease: "power2.out" }, 12.85);
      tl.to("#a-mouse", { y: 0, duration: 0.2, ease: "power2.in" }, 13.05);
      tl.set("#a-mflip", { scaleX: -1, x: 120 }, 13.0);
      // the roar: anticipation, then mouth wide, brows down, camera shakes
      tl.to("#a-head", { rotation: -4, x: -10, svgOrigin: "470 250", duration: 0.35, ease: "power2.in" }, 13.5);
      tl.to("#a-brows", { opacity: 1, duration: 0.1 }, 13.7);
      tl.to("#a-mouth", { opacity: 0, duration: 0.05 }, 13.95);
      tl.to("#a-roar", { opacity: 1, duration: 0.05 }, 13.95);
      tl.to("#a-head", { rotation: -14, x: 24, svgOrigin: "470 250", duration: 0.2, ease: "expo.out" }, 13.95);
      shake("#a-cam", 14.0, 1.2, 10, 22);
      tl.to("#a-mwrap", { x: 1690, duration: 0.3, ease: "expo.out" }, 14.05);
      tl.to("#a-roar", { opacity: 0, duration: 0.1 }, 15.4);
      tl.to("#a-mouth", { opacity: 1, duration: 0.1 }, 15.4);
      tl.to("#a-head", { rotation: -8, x: 0, svgOrigin: "470 250", duration: 0.4, ease: "power2.out" }, 15.4);
      // paw lifts, then slams down on the mouse
      tl.to("#a-paw", { x: 150, y: -130, rotation: -10, svgOrigin: "560 424", duration: 0.35, ease: "power2.out" }, 15.75);
      tl.to("#a-paw", { x: 165, y: -20, rotation: 0, svgOrigin: "560 424", duration: 0.12, ease: "power3.in" }, 16.12);
      shake("#a-cam", 16.24, 0.4, 8, 24);
      tl.to("#a-mhead", { y: 4, duration: 0.1 }, 16.24);

      // ---- l3 + m1 (20.7 - 28.1): push in; the mouse begs ----
      cam("#a-cam", 19.6, 1.9, 1560, 830, 1.2);
      tl.to("#a-meye", { attr: { r: 6 }, duration: 0.2, ease: "back.out(3)" }, 20.8);
      shake("#a-mbody", 21.0, 2.6, 2.5, 18);
      tl.to("#a-mhead", { rotation: -14, svgOrigin: "80 40", duration: 0.35, ease: "power2.out" }, 24.0);
      tl.to("#a-mhead", { rotation: -6, svgOrigin: "80 40", duration: 0.3, yoyo: true, repeat: 5, ease: "sine.inOut" }, 24.4);
      tl.to("#a-brows", { opacity: 0, duration: 0.2 }, 26.0);
      tl.to("#a-head", { rotation: -2, svgOrigin: "470 250", duration: 0.5, ease: "power2.inOut" }, 26.0);

      // ---- l4 (29.7 - 37.8): the lion laughs, amused, and lets the mouse go ----
      cam("#a-cam", 29.3, 1.25, 1250, 740, 1.0);
      tl.to("#a-mouth", { opacity: 0, duration: 0.05 }, 29.95);
      tl.to("#a-roar", { opacity: 1, duration: 0.05 }, 29.95);
      tl.to("#a-eyesOpen", { opacity: 0, duration: 0.05 }, 29.95);
      tl.to("#a-eyesHappy", { opacity: 1, duration: 0.05 }, 29.95);
      tl.to("#a-head", { rotation: -16, svgOrigin: "470 250", duration: 0.22, yoyo: true, repeat: 9, ease: "sine.inOut" }, 30.0);
      tl.to("#a-torso", { y: 34, duration: 0.22, yoyo: true, repeat: 9, ease: "sine.inOut" }, 30.05);
      tl.to("#a-roar", { opacity: 0, duration: 0.1 }, 32.3);
      tl.to("#a-smile", { opacity: 1, duration: 0.1 }, 32.3);
      tl.to("#a-head", { rotation: 2, svgOrigin: "470 250", duration: 0.5, ease: "power2.out" }, 32.5);
      // "let the mouse go": paw lifts away
      tl.to("#a-paw", { x: 60, y: -110, rotation: -14, svgOrigin: "560 424", duration: 0.5, ease: "power2.out" }, 35.2);
      tl.to("#a-meye", { attr: { r: 3.6 }, duration: 0.2 }, 35.4);
      tl.to("#a-mhead", { rotation: 0, svgOrigin: "80 40", duration: 0.2 }, 35.4);
      tl.to("#a-mouse", { y: -26, duration: 0.18, yoyo: true, repeat: 1, ease: "power2.out" }, 35.6);
      tl.to("#a-mwrap", { x: 2100, duration: 1.6, ease: "power2.in" }, 36.1);
      tl.to("#a-mouse", { y: -6, duration: 0.12, repeat: 13, yoyo: true, ease: "sine.inOut" }, 36.1);
      tl.set("#a-mflip", { scaleX: 1, x: 0 }, 36.0);
      tl.to("#a-paw", { x: 0, y: 0, rotation: 0, svgOrigin: "560 424", duration: 0.6, ease: "power2.inOut" }, 36.6);
      // hand-off: the light dims to the next day
      tl.to("#a-cam", { opacity: 0, duration: 0.8, ease: "power2.in" }, 38.2);
      window.__timelines["part1"] = tl;
    })();
