    <div id="cap-0" class="cap clip" data-start="0.650" data-duration="1.735"><span class="cap-t">సింహం మరియు ఎలుక.</span></div>
    <div id="cap-1" class="cap clip" data-start="4.450" data-duration="1.407"><span class="cap-t">ఒక చిన్న ఎలుక</span></div>
    <div id="cap-2" class="cap clip" data-start="5.857" data-duration="1.490"><span class="cap-t">అడవిలో అటూ ఇటూ</span></div>
    <div id="cap-3" class="cap clip" data-start="7.347" data-duration="2.980"><span class="cap-t">పరుగెడుతూ, పొరపాటున నిద్రపోతున్న</span></div>
    <div id="cap-4" class="cap clip" data-start="10.327" data-duration="2.897"><span class="cap-t">సింహం పంజా మీదుగా పరుగెత్తింది.</span></div>
    <div id="cap-5" class="cap clip" data-start="13.675" data-duration="1.885"><span class="cap-t">సింహం ఉలిక్కిపడి లేచి,</span></div>
    <div id="cap-6" class="cap clip" data-start="15.560" data-duration="1.450"><span class="cap-t">కోపంతో గర్జించి,</span></div>
    <div id="cap-7" class="cap clip" data-start="17.011" data-duration="1.305"><span class="cap-t">ఆ చిన్న ఎలుకను</span></div>
    <div id="cap-8" class="cap clip" data-start="18.316" data-duration="1.233"><span class="cap-t">తన పెద్ద పంజా</span></div>
    <div id="cap-9" class="cap clip" data-start="19.549" data-duration="1.450"><span class="cap-t">కింద బంధించింది.</span></div>
    <div id="cap-10" class="cap clip" data-start="22.175" data-duration="1.435"><span class="cap-t">భయపడిన ఎలుక తన</span></div>
    <div id="cap-11" class="cap clip" data-start="23.610" data-duration="1.993"><span class="cap-t">ప్రాణం కోసం వేడుకుంటూ</span></div>
    <div id="cap-12" class="cap clip" data-start="25.604" data-duration="1.037"><span class="cap-t">ఇలా అంది,</span></div>
    <div id="cap-13" class="cap clip quote" data-start="27.090" data-duration="2.083"><span class="cap-t">“దయచేసి నన్ను వదిలేయండి!</span></div>
    <div id="cap-14" class="cap clip quote" data-start="29.173" data-duration="1.562"><span class="cap-t">మీరు దయ చూపిస్తే,</span></div>
    <div id="cap-15" class="cap clip quote" data-start="30.735" data-duration="1.116"><span class="cap-t">ఏదో ఒక రోజు</span></div>
    <div id="cap-16" class="cap clip quote" data-start="31.851" data-duration="2.157"><span class="cap-t">నేను మీకు సహాయం చేయగలను.”</span></div>
    <div id="cap-17" class="cap clip" data-start="34.459" data-duration="1.473"><span class="cap-t">ఒక చిన్న ఎలుక</span></div>

    <div id="cap-19" class="cap clip" data-start="38.271" data-duration="2.253"><span class="cap-t">సహాయం చేయగలదనే ఆలోచనకు</span></div>
    <div id="cap-20" class="cap clip" data-start="40.524" data-duration="1.646"><span class="cap-t">సింహం నవ్వింది,</span></div>

    <div id="cap-22" class="cap clip" data-start="44.250" data-duration="1.906"><span class="cap-t">ఎలుకను వదిలేసింది.</span></div>
    <div id="cap-23" class="cap clip" data-start="46.606" data-duration="1.914"><span class="cap-t">కొన్ని రోజుల తర్వాత,</span></div>

    <div id="cap-28" class="cap clip" data-start="58.388" data-duration="1.770"><span class="cap-t">గట్టిగా గర్జించింది,</span></div>
    <div id="cap-29" class="cap clip" data-start="60.158" data-duration="2.656"><span class="cap-t">కానీ తాళ్లు ఇంకా బిగుసుకున్నాయి.</span></div>
    <div id="cap-30" class="cap clip" data-start="63.263" data-duration="1.178"><span class="cap-t">ఆ శబ్దం విని,</span></div>

    <div id="cap-32" class="cap clip" data-start="65.895" data-duration="2.217"><span class="cap-t">అక్కడికి పరుగెత్తుకొచ్చింది.</span></div>
    <div id="cap-33" class="cap clip" data-start="68.563" data-duration="1.657"><span class="cap-t">తన పదునైన పళ్లతో,</span></div>

    <div id="cap-35" class="cap clip" data-start="71.799" data-duration="2.052"><span class="cap-t">మందపాటి తాళ్లను వేగంగా</span></div>
    <div id="cap-36" class="cap clip" data-start="73.850" data-duration="2.762"><span class="cap-t">కొరికి, సింహాన్ని విడిపించింది.</span></div>
    <div id="cap-37" class="cap clip" data-start="77.563" data-duration="1.849"><span class="cap-t">సింహం చిరునవ్వుతో ఆ</span></div>
    <div id="cap-38" class="cap clip" data-start="79.412" data-duration="2.090"><span class="cap-t">చిన్న ఎలుకకు కృతజ్ఞతలు</span></div>
    <div id="cap-39" class="cap clip" data-start="81.502" data-duration="1.930"><span class="cap-t">చెప్పింది, చివరకు ఒక</span></div>
    <div id="cap-40" class="cap clip" data-start="83.432" data-duration="3.055"><span class="cap-t">విలువైన సత్యాన్ని అర్థం చేసుకుంది.</span></div>
