      tl.fromTo("#gB-slab", { opacity: 0 }, { opacity: 1, duration: 0.3 }, bT + 0.3);
      tl.fromTo("#gB-sl", { opacity: 0 }, { opacity: 1, duration: 0.3 }, bT + 0.3);
      tl.fromTo("#gB-groove", { opacity: 0 }, { opacity: 1, duration: 0.2 }, bT + 0.7);
      ["#gB-c1", "#gB-mesh", "#gB-c2", "#gB-paint"].forEach((sel, k) => {
        tl.fromTo(sel, { scaleX: 0, transformOrigin: "0% 50%" }, { scaleX: 1, duration: 0.4, ease: "expo.out" }, bT + 1.0 + k * 0.45);
      });
      const bl = gsap.utils.toArray("#gB .gB-l").reverse();
      bl.forEach((el, k) => tl.fromTo(el, { opacity: 0 }, { opacity: 1, duration: 0.2 }, bT + 0.8 + k * 0.45));
      tl.fromTo("#gB-water", { scaleY: 0, transformOrigin: "50% 100%" }, { scaleY: 1, duration: 0.6, ease: "expo.out" }, bT + 3.0);
      tl.fromTo("#gB-wl", { opacity: 0 }, { opacity: 1, duration: 0.2 }, bT + 3.2);
      tl.fromTo("#gB-foot", { opacity: 0 }, { opacity: 1, duration: 0.3 }, bT + 1.8);

      // G: lip section, then the sheet falls
      const gT = 12;
      tl.fromTo("#gG-rock", { opacity: 0 }, { opacity: 1, duration: 0.3 }, gT + 0.3);
      tl.fromTo("#gG-water, #gG-wl", { opacity: 0 }, { opacity: 1, duration: 0.3 }, gT + 0.5);
      tl.fromTo("#gG-lip", { strokeDasharray: 200, strokeDashoffset: 200 }, { strokeDashoffset: 0, duration: 0.5, ease: "power2.inOut" }, gT + 0.9);
      tl.fromTo("#gG-anchors", { opacity: 0 }, { opacity: 1, duration: 0.2 }, gT + 1.3);
      tl.fromTo("#gG-sheet", { strokeDasharray: 420, strokeDashoffset: 420 }, { strokeDashoffset: 0, duration: 0.6, ease: "power3.in" }, gT + 1.6);
      tl.fromTo("#gG-sheet-dash", { opacity: 0, strokeDashoffset: 0 }, { opacity: 1, strokeDashoffset: -30 * 14, duration: 3.8, ease: "none" }, gT + 2.2);
      gsap.utils.toArray("#gG .gG-l").forEach((el, k) => tl.fromTo(el, { opacity: 0 }, { opacity: 1, duration: 0.2 }, gT + 1.1 + k * 0.5));
      tl.fromTo("#gG-foot", { opacity: 0 }, { opacity: 1, duration: 0.3 }, gT + 1.6);

      // C: the pipe line builds upward, then water climbs it
      const cT = 18;
      tl.fromTo("#gC-pond, #gC-surf", { opacity: 0 }, { opacity: 1, duration: 0.3 }, cT + 0.3);
      tl.fromTo("#gC-pipe", { strokeDasharray: 520, strokeDashoffset: 520 }, { strokeDashoffset: 0, duration: 0.8, ease: "power2.inOut" }, cT + 0.5);
      gsap.utils.toArray("#gC .gC-c").forEach((el, k) => tl.fromTo(el, { opacity: 0 }, { opacity: 1, duration: 0.2 }, cT + 0.7 + k * 0.4));
      tl.fromTo("#gC-flow", { opacity: 0, strokeDashoffset: 0 }, { opacity: 1, strokeDashoffset: -30 * 12, duration: 3.6, ease: "none" }, cT + 2.4);
      tl.fromTo("#gC-foot", { opacity: 0 }, { opacity: 1, duration: 0.3 }, cT + 1.6);

      // D: 65 A struck through, 21 A lands
      const dT = 24;
      tl.fromTo("#gD .d-cap", { opacity: 0 }, { opacity: 1, duration: 0.2 }, dT + 0.3);
      tl.fromTo("#gD-old", { opacity: 0 }, { opacity: 1, duration: 0.3 }, dT + 0.5);
      tl.fromTo("#gD-strike", { scaleX: 0, transformOrigin: "0% 50%" }, { scaleX: 1, duration: 0.3, ease: "expo.out" }, dT + 1.3);
      tl.fromTo("#gD-new", { opacity: 0, x: -30, filter: "blur(8px)" }, { opacity: 1, x: 0, filter: "blur(0px)", duration: 0.45, ease: "expo.out" }, dT + 1.5);
      ["#gD-f1", "#gD-f2", "#gD-f3"].forEach((s, k) => tl.fromTo(s, { opacity: 0 }, { opacity: 1, duration: 0.25 }, dT + 2.2 + k * 0.35));

      // E: the waterline splits above from below
      const eT = 30;
      tl.fromTo("#gE-line", { scaleX: 0, transformOrigin: "0% 50%" }, { scaleX: 1, duration: 0.6, ease: "expo.out" }, eT + 0.3);
      tl.fromTo("#gE-under", { opacity: 0 }, { opacity: 1, duration: 0.4 }, eT + 0.6);
      tl.fromTo("#gE-a", { opacity: 0, y: -20 }, { opacity: 1, y: 0, duration: 0.45, ease: "expo.out" }, eT + 0.9);
      tl.fromTo("#gE-b", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.45, ease: "expo.out" }, eT + 1.4);
      tl.fromTo("#gE-foot", { opacity: 0 }, { opacity: 1, duration: 0.3 }, eT + 1.8);

      // F: rock photo + the area
      const fT = 36;
      tl.fromTo("#gF .g-photo", { clipPath: "inset(0 0 0 100%)" }, { clipPath: "inset(0 0 0 0%)", duration: 0.6, ease: "expo.out" }, fT + 0.2);
      tl.fromTo("#gF-img", { scale: 1.02 }, { scale: 1.1, duration: 6, ease: "none" }, fT);
      tl.fromTo("#gF-t1", { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.4, ease: "expo.out" }, fT + 1.0);
      tl.fromTo("#gF-foot", { opacity: 0 }, { opacity: 1, duration: 0.3 }, fT + 1.6);

      // H: tests ticked, then the 7 days fill
      const hT = 42;
      ["#gH-1", "#gH-2", "#gH-3"].forEach((s, k) => tl.fromTo(s, { opacity: 0 }, { opacity: 1, duration: 0.2 }, hT + 0.4 + k * 0.35));
      tl.fromTo("#gH-days", { opacity: 0 }, { opacity: 1, duration: 0.3 }, hT + 1.2);
      gsap.utils.toArray("#gH .h-day .f").forEach((el, k) => tl.fromTo(el, { scaleY: 0, transformOrigin: "50% 100%" }, { scaleY: 1, duration: 0.25, ease: "expo.out" }, hT + 1.4 + k * 0.22));
      tl.fromTo("#gH-foot", { opacity: 0 }, { opacity: 1, duration: 0.3 }, hT + 1.8);

      // ledger: bar segments fill as each group is named
      tl.fromTo("#g-ledger", { opacity: 0 }, { opacity: 1, duration: 0.3 }, 0.1);
      gsap.utils.toArray("#g-bar .g-seg i").forEach((el, i) => {
        tl.fromTo(el, { scaleX: 0, transformOrigin: "0% 50%", backgroundColor: "#1e86b8" }, { scaleX: 1, duration: 0.8, ease: "power2.inOut" }, i * CH + 0.5);
        tl.to(el, { backgroundColor: "#1f1a17", duration: 0.3 }, i * CH + CH - 0.2);
      });
      // running total, computed from timeline time so any frame renders on its own
      const num = document.getElementById("g-led-num");
      const clock = { t: 0 };
      const fmt = (n) => "₹" + Math.round(n).toLocaleString("en-IN");
      tl.fromTo(clock, { t: 0 }, {
        t: 48, duration: 48, ease: "none",
        onUpdate: () => {
          let total = 0;
          for (let i = 0; i < amounts.length; i++) {
            const p = Math.min(1, Math.max(0, (clock.t - (i * CH + 0.5)) / 0.8));
            total += amounts[i] * p;
          }
          num.textContent = fmt(total);
        },
      }, 0);
      window.__timelines["groups"] = tl;
    })();
  </script>
</template>
