<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="assets/vendor/gsap.min.js"></script>
    <style>
      :root {
        --ground: #cfcac2;
        --ink: #1f1a17;
        --water: #1e86b8;
        --font-display: "Oswald", sans-serif;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: var(--ground);
      }
      #root {
        width: 100%;
        height: 100%;
        position: relative;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="107.5"
      data-width="1920"
      data-height="1080"
    >
      <div id="hook" class="clip" data-composition-id="hook" data-composition-src="compositions/hook.html"
        data-start="0" data-duration="6.5" data-track-index="1" data-track-kind="graphics"
        data-width="1920" data-height="1080"></div>
      <div id="today" class="clip" data-composition-id="today" data-composition-src="compositions/today.html"
        data-start="6.5" data-duration="10.5" data-track-index="1" data-track-kind="graphics"
        data-width="1920" data-height="1080"></div>
      <div id="loop" class="clip" data-composition-id="loop" data-composition-src="compositions/loop.html"
        data-start="17" data-duration="14" data-track-index="1" data-track-kind="graphics"
        data-width="1920" data-height="1080"></div>
      <div id="plan" class="clip" data-composition-id="plan" data-composition-src="compositions/plan.html"
        data-start="31" data-duration="7.5" data-track-index="1" data-track-kind="graphics"
        data-width="1920" data-height="1080"></div>
      <div id="groups" class="clip" data-composition-id="groups" data-composition-src="compositions/groups.html"
        data-start="38.5" data-duration="48" data-track-index="1" data-track-kind="graphics"
        data-width="1920" data-height="1080"></div>
      <div id="renders" class="clip" data-composition-id="renders" data-composition-src="compositions/renders.html"
        data-start="86.5" data-duration="12" data-track-index="1" data-track-kind="graphics"
        data-width="1920" data-height="1080"></div>
      <div id="close" class="clip" data-composition-id="close" data-composition-src="compositions/close.html"
        data-start="98.5" data-duration="9" data-track-index="1" data-track-kind="graphics"
        data-width="1920" data-height="1080"></div>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
